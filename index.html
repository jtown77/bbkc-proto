<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BBKC — Builder Cart Prototype v1</title>
<link href="https://fonts.googleapis.com/css2?family=League+Gothic&display=swap" rel="stylesheet">
<style>
  /* ── BBKC design tokens (src/constants/colors.ts + theme.ts) ── */
  :root {
    --bg: #121215; --card: #1E1E22; --card-elev: #28282D;
    --primary: #A93F48; --cream: #F2E8D5;
    --text: #F2E8D5; --text2: #7A7A7D;
    --success: #4CAF82; --error: #E54B4B; --border: #2A2A2E;
    --r-sm: 8px; --r-md: 12px; --r-btn: 10px;
  }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; }
  body {
    background:#000; color:var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display:flex; justify-content:center;
  }
  #phone {
    width:100%; max-width:430px; height:100dvh; background:var(--bg);
    display:flex; flex-direction:column; position:relative; overflow:hidden;
  }
  .gothic { font-family:'League Gothic', Impact, sans-serif; letter-spacing:.5px; }

  /* ── demo mode switch (prototype chrome, not app UI) ── */
  #demoBar { display:flex; gap:6px; padding:8px 12px; background:#000; }
  #demoBar span { color:#555; font-size:10px; align-self:center; margin-right:2px; letter-spacing:1px; }
  .demoTab { flex:1; text-align:center; padding:6px 0; font-size:12px; color:var(--text2);
    border:1px solid #333; border-radius:999px; cursor:pointer; }
  .demoTab.on { color:var(--cream); border-color:var(--primary); background:rgba(169,63,72,.18); }

  /* ── header ── */
  header { padding:14px 16px 10px; display:flex; align-items:center; gap:10px; }
  header .back { color:var(--text2); font-size:22px; line-height:1; cursor:pointer; }
  header h1 { font-size:30px; font-weight:400; text-transform:uppercase; }
  header .sub { margin-left:auto; color:var(--text2); font-size:12px; text-align:right; line-height:1.3; }

  /* ── cart bar ── */
  #cartBar {
    margin:0 12px 10px; background:var(--card-elev); border:1px solid var(--border);
    border-radius:var(--r-md); padding:10px 14px; display:flex; align-items:center; gap:10px;
    cursor:pointer; transition:transform .12s ease, border-color .2s;
    position:relative;
  }
  #cartBar.bump { transform:scale(1.03); border-color:var(--primary); }
  #cartBar .icon { display:flex; align-items:center; }
  #cartBar .info { flex:1; min-width:0; }
  #cartBar .info .line1 { font-size:14px; font-weight:600; }
  #cartBar .info .line2 { font-size:11px; color:var(--text2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #cartBar .dots { display:flex; }
  #cartBar .dots .d {
    width:20px; height:20px; border-radius:50%; border:2px solid var(--card-elev);
    margin-left:-6px; font-size:0;
  }
  #cartBar .chev { color:var(--text2); font-size:16px; }
  #cartBar .badge {
    position:absolute; top:-7px; left:26px; background:var(--primary); color:#fff;
    min-width:18px; height:18px; border-radius:9px; font-size:11px; font-weight:700;
    display:flex; align-items:center; justify-content:center; padding:0 5px;
  }
  #groupPill {
    margin:0 12px 8px; display:none; align-items:center; gap:8px;
    background:rgba(169,63,72,.14); border:1px dashed var(--primary); border-radius:999px;
    padding:7px 14px; font-size:12px; color:var(--cream);
  }
  #groupPill b { color:#fff; }
  #groupPill .swap { margin-left:auto; color:var(--primary); font-weight:700; font-size:11px; cursor:pointer; letter-spacing:.5px; }

  /* ── search + chips ── */
  #search { margin:0 12px 8px; display:flex; background:var(--card); border:1px solid var(--border);
    border-radius:var(--r-btn); align-items:center; padding:0 12px; }
  #search input { flex:1; background:none; border:none; outline:none; color:var(--text);
    font-size:15px; padding:10px 8px; }
  #search .mag { color:var(--text2); }
  #chips { display:flex; gap:8px; margin:0 12px 10px; }
  .chip { padding:6px 14px; border-radius:999px; border:1px solid var(--border); color:var(--text2);
    font-size:13px; cursor:pointer; }
  .chip.on { background:var(--cream); color:#121215; border-color:var(--cream); font-weight:600; }

  /* ── library ── */
  #library { flex:1; overflow-y:auto; padding:0 12px 90px; }
  .cat { margin-bottom:10px; background:var(--card); border:1px solid var(--border); border-radius:var(--r-md); overflow:hidden; }
  .catHead { display:flex; align-items:center; padding:12px 14px; cursor:pointer; }
  .catHead .cname { font-size:20px; text-transform:uppercase; }
  .catHead .count { color:var(--text2); font-size:12px; margin-left:8px; }
  .catHead .arrow { margin-left:auto; color:var(--text2); transition:transform .15s; }
  .cat.open .arrow { transform:rotate(90deg); }
  .cat .rows { display:none; }
  .cat.open .rows { display:block; }
  .exRow { display:flex; align-items:center; padding:11px 14px; border-top:1px solid var(--border); cursor:pointer; }
  .exRow:active { background:var(--card-elev); }
  .exRow .play { width:26px; height:26px; border-radius:50%; background:var(--card-elev);
    display:flex; align-items:center; justify-content:center; font-size:10px; color:var(--text2); margin-right:10px; flex:none; }
  .exRow .nm { font-size:15px; flex:1; }
  .exRow .eq { font-size:10px; color:var(--text2); border:1px solid var(--border); padding:2px 7px;
    border-radius:999px; margin-right:10px; letter-spacing:.5px; }
  .exRow .add { width:28px; height:28px; border-radius:50%; border:1.5px solid var(--primary);
    color:var(--primary); font-size:18px; line-height:1; display:flex; align-items:center; justify-content:center; flex:none; }
  .exRow.inCart .add { background:var(--primary); color:#fff; border-color:var(--primary); font-size:12px; font-weight:700; }

  /* ── fly-to-cart dot ── */
  .flyDot { position:absolute; width:16px; height:16px; border-radius:50%; z-index:60;
    pointer-events:none; transition:all .5s cubic-bezier(.5,-0.2,.6,1); }

  /* ── cart sheet ── */
  #cartSheet {
    position:absolute; inset:0; background:var(--bg); z-index:40;
    transform:translateY(104%); transition:transform .28s cubic-bezier(.3,.9,.3,1);
    display:flex; flex-direction:column;
  }
  #cartSheet.open { transform:translateY(0); }
  #cartSheet header h1 { font-size:28px; }
  #cartList { flex:1; overflow-y:auto; padding:4px 12px 130px; }

  .mvCard { background:var(--card); border:1px solid var(--border); border-radius:var(--r-md);
    display:flex; align-items:center; padding:10px 10px; position:relative; }
  .mvCard.chained { border-color:rgba(169,63,72,.55); }
  .mv .ord { display:flex; flex-direction:column; margin-right:8px; }
  .ordBtn { color:var(--text2); font-size:13px; padding:2px 6px; cursor:pointer; }
  .ordBtn:active { color:var(--cream); }
  .wDot { min-width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:800; margin-right:10px; cursor:pointer; flex:none; padding:0 4px; }
  .mvName { flex:1; font-size:14px; font-weight:600; line-height:1.25; padding-right:6px; }
  .mvName small { display:block; color:var(--text2); font-weight:400; font-size:11px; margin-top:1px; }
  .repCtl { display:flex; align-items:center; gap:2px; background:var(--card-elev); border-radius:999px; padding:3px 5px; margin-right:6px; }
  .repCtl .pm { width:24px; height:24px; display:flex; align-items:center; justify-content:center;
    color:var(--primary); font-size:17px; font-weight:700; cursor:pointer; }
  .repCtl .rv { min-width:30px; text-align:center; font-size:14px; font-weight:700; }
  .repCtl .rv small { font-size:9px; color:var(--text2); display:block; margin-top:-2px; }
  .rm { color:var(--text2); font-size:16px; padding:6px; cursor:pointer; }

  /* chain connector */
  .link { display:flex; align-items:center; justify-content:center; height:34px; gap:8px; cursor:pointer; position:relative; }
  .link .ln { width:34px; height:1.5px; background:var(--border); }
  .link.on .ln { background:var(--primary); }
  .link .ic { color:var(--text2); font-size:15px; transform:rotate(45deg); }
  .link.on .ic { color:var(--primary); }
  .link .flowTag { font-size:9px; letter-spacing:1.5px; color:var(--primary); font-weight:800; }
  .flowReps { display:flex; align-items:center; gap:2px; margin-left:6px; background:rgba(169,63,72,.16);
    border-radius:999px; padding:2px 4px; }
  .flowReps .pm { width:22px; height:22px; display:flex; align-items:center; justify-content:center;
    color:var(--primary); font-weight:800; font-size:15px; cursor:pointer; }
  .flowReps .fv { font-size:12px; font-weight:800; min-width:24px; text-align:center; color:var(--cream); }
  .flowHint { text-align:center; color:var(--text2); font-size:10px; margin:-2px 0 6px; letter-spacing:.3px; }

  /* rest block */
  .restCard { border:1.5px dashed var(--border); border-radius:var(--r-md);
    display:flex; align-items:center; padding:8px 10px; background:rgba(122,122,125,.06); }
  .restCard .rIcon { width:40px; height:40px; border-radius:50%; background:var(--card-elev);
    display:flex; align-items:center; justify-content:center; margin-right:10px; font-size:16px; flex:none; }
  .restCard .rName { flex:1; font-size:13px; font-weight:700; letter-spacing:1.5px; color:var(--text2); }
  .restCard .rName small { display:block; letter-spacing:0; font-weight:400; font-size:10px; margin-top:1px; }
  .restGap { height:10px; }
  #addRest { width:100%; border:1.5px dashed var(--border); background:none; color:var(--text2);
    padding:11px; border-radius:var(--r-md); font-size:13px; cursor:pointer; margin-top:2px; }
  #addRest b { color:var(--primary); }

  /* group blocks (EMOM) */
  .grp { border:1px solid var(--border); border-radius:var(--r-md); margin-bottom:14px; overflow:hidden; }
  .grp.active { border-color:var(--primary); }
  .grpHead { display:flex; align-items:center; background:var(--card-elev); padding:10px 12px; cursor:pointer; }
  .grpHead .gname { font-size:19px; text-transform:uppercase; }
  .grpHead .mins { color:var(--text2); font-size:11px; margin-left:8px; }
  .grpHead .intervals { margin-left:auto; display:flex; gap:5px; }
  .intBtn { font-size:11px; padding:3px 9px; border-radius:999px; border:1px solid var(--border); color:var(--text2); cursor:pointer; }
  .intBtn.on { background:var(--cream); color:#121215; border-color:var(--cream); font-weight:700; }
  .grpBody { padding:8px; }
  .grpEmpty { text-align:center; color:var(--text2); font-size:12.5px; padding:14px 10px; }
  .grpEmpty b { color:var(--primary); }
  .grpAddRow { text-align:center; padding:9px; color:var(--primary); font-size:13px; font-weight:700; cursor:pointer; border-top:1px dashed var(--border); }
  #addGroup { width:100%; border:1.5px dashed var(--border); background:none; color:var(--text2);
    padding:12px; border-radius:var(--r-md); font-size:14px; cursor:pointer; margin-bottom:8px; }

  /* footer */
  .foot { position:absolute; bottom:0; left:0; right:0; padding:12px 16px 24px;
    background:linear-gradient(transparent, var(--bg) 30%); z-index:45; }
  .foot .stats { display:flex; justify-content:center; gap:18px; margin-bottom:10px; font-size:12px; color:var(--text2); }
  .foot .stats b { color:var(--cream); }
  .cta { width:100%; background:var(--primary); border:none; color:#fff; font-size:16px; font-weight:700;
    padding:15px; border-radius:var(--r-btn); cursor:pointer; }
  .cta:disabled { opacity:.35; }
  .ghost { width:100%; background:none; border:none; color:var(--text2); font-size:13px; padding:10px; cursor:pointer; }

  /* bell picker sheet */
  #bellSheet { position:absolute; left:0; right:0; bottom:0; background:var(--card-elev);
    border-radius:16px 16px 0 0; padding:18px 16px 30px; z-index:70; transform:translateY(110%);
    transition:transform .22s ease; box-shadow:0 -8px 30px rgba(0,0,0,.5); }
  #bellSheet.open { transform:translateY(0); }
  #bellSheet h3 { font-size:22px; text-transform:uppercase; margin-bottom:12px; }
  #bells { display:flex; flex-wrap:wrap; gap:10px; }
  .bell { width:52px; height:52px; border-radius:50%; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-weight:800; font-size:13px; cursor:pointer; border:2.5px solid transparent; }
  .bell small { font-size:8px; font-weight:600; opacity:.8; }
  .bell.sel { border-color:var(--cream); }
  #scrim { position:absolute; inset:0; background:rgba(0,0,0,.6); z-index:65; display:none; }
  #scrim.on { display:block; }

  /* toast */
  #toast { position:absolute; bottom:110px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--cream); color:#121215; padding:9px 18px; border-radius:999px; font-size:13px;
    font-weight:600; opacity:0; transition:all .25s; z-index:80; pointer-events:none; white-space:nowrap; }
  #toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

  .empty { text-align:center; padding:60px 30px; color:var(--text2); }
  .empty .big { font-size:40px; margin-bottom:8px; }
  .empty .loadBear { color:var(--primary); font-weight:700; cursor:pointer; margin-top:14px; display:inline-block; font-size:13px; }
</style>
</head>
<body>
<div id="phone">

  <div id="demoBar">
    <span>DEMO</span>
    <div class="demoTab on" id="tabFixed" onclick="setMode('fixed')">Fixed Sets / AMRAP</div>
    <div class="demoTab" id="tabEmom" onclick="setMode('emom')">EMOM (groups)</div>
  </div>

  <header>
    <div class="back">‹</div>
    <h1 class="gothic" id="hTitle">Build Your Circuit</h1>
    <div class="sub" id="hSub">Part 1 · Fixed Sets</div>
  </header>

  <!-- CART BAR -->
  <div id="cartBar" onclick="openCart()">
    <div class="icon"><svg id="kbIcon" width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M8.2 9.1C8.07 8.2 7.6 5.9 7.6 5.2c0-1.5 1.6-2.4 4.4-2.4s4.4.9 4.4 2.4c0 .7-.47 3-.6 3.9" stroke="#F2E8D5" stroke-width="1.9" stroke-linecap="round"/><path d="M12 21.2c-4 0-6.6-2.5-6.6-6 0-2.4 1.3-4.6 3.2-5.7a6.8 6.8 0 0 1 6.8 0c1.9 1.1 3.2 3.3 3.2 5.7 0 3.5-2.6 6-6.6 6Z" fill="#F2E8D5"/></svg></div>
    <div class="badge" id="cartCount">0</div>
    <div class="info">
      <div class="line1" id="cartLine1">The Rack is empty</div>
      <div class="line2" id="cartLine2">Tap exercises below to add them</div>
    </div>
    <div class="dots" id="cartDots"></div>
    <div class="chev">›</div>
  </div>

  <!-- EMOM active-group pill -->
  <div id="groupPill">
    Adding to <b id="pillGroup">Group 1 · Min 1</b>
    <div class="swap" onclick="openCart(event)">CHANGE ›</div>
  </div>

  <div id="search"><span class="mag">⌕</span><input id="q" placeholder="Search exercises…" oninput="renderLib()"></div>
  <div id="chips">
    <div class="chip on" data-eq="all" onclick="setEq('all',this)">All</div>
    <div class="chip" data-eq="single" onclick="setEq('single',this)">Single</div>
    <div class="chip" data-eq="double" onclick="setEq('double',this)">Double</div>
    <div class="chip" data-eq="bodyweight" onclick="setEq('bodyweight',this)">Bodyweight</div>
  </div>

  <div id="library"></div>

  <!-- CART SHEET -->
  <div id="cartSheet">
    <header>
      <div class="back" onclick="closeCart()">‹</div>
      <h1 class="gothic" id="cartTitle">The Rack</h1>
      <div class="sub" id="cartSub"></div>
    </header>
    <div id="cartList"></div>
    <div class="foot">
      <div class="stats" id="cartStats"></div>
      <button class="cta" id="doneBtn" onclick="toast('Next: sets & rest → name & post (unchanged)')">Looks Good — Continue</button>
      <button class="ghost" onclick="closeCart()">+ Add more exercises</button>
    </div>
  </div>

  <div id="scrim" onclick="closeBell()"></div>
  <div id="bellSheet">
    <h3 class="gothic" id="bellFor">Pick a bell</h3>
    <div id="bells"></div>
  </div>

  <div id="toast"></div>
</div>

<script>
/* ── data: real BBKC bell map + a representative slice of the library ── */
const BELLS = [
  {kg:8,lbs:18,c:'#FFB6C1',n:'Pink',dark:true},{kg:12,lbs:26,c:'#4A90D9',n:'Blue'},
  {kg:16,lbs:35,c:'#FFFF00',n:'Yellow',dark:true},{kg:20,lbs:44,c:'#800080',n:'Purple'},
  {kg:24,lbs:53,c:'#008000',n:'Green'},{kg:28,lbs:62,c:'#FFA500',n:'Orange',dark:true},
  {kg:32,lbs:70,c:'#FF0000',n:'Red'},{kg:36,lbs:79,c:'#808080',n:'Grey'},
  {kg:40,lbs:88,c:'#FFFFFF',n:'White',dark:true},{kg:44,lbs:97,c:'#C0C0C0',n:'Silver',dark:true},
  {kg:48,lbs:106,c:'#FFD700',n:'Gold',dark:true},
];
const LIB = {
  'Hinge': [['Two-Hand Swing','single'],['Single-Arm Swing','single'],['Double Swing','double'],['Deadlift','single'],['Single-Leg Deadlift','single'],['Good Morning','single']],
  'Squat': [['Goblet Squat','single'],['Double Front Rack Squat','double'],['Reverse Lunge','single'],['Cossack Squat','single'],['Bulgarian Split Squat','single']],
  'Press': [['Push Press','single'],['Double Push Press','double'],['Military Press','single'],['Floor Press','single'],['Push-Up','bodyweight']],
  'Pull':  [['Bent-Over Row','single'],['Double Bent-Over Row','double'],['High Pull','single'],['Renegade Row','double']],
  'Combo': [['Clean','single'],['Double Clean','double'],['Snatch','single'],['Thruster','single'],['Turkish Get-Up','single'],['Clean & Press','single']],
  'Core':  [['Plank','bodyweight'],['Russian Twist','single'],['Halo','single'],['Windmill','single']],
  'Carry': [['Farmer Carry','double'],['Suitcase Carry','single'],['Front Rack Carry','double'],['Overhead Carry','single']],
};

/* ── state ── */
let mode = 'fixed';
let eq = 'all';
let cart = [];            // fixed: [{name,eqp,lbs,reps,flow:0|groupIdx? , flowReps}]
let flows = [];           // fixed mode: chain membership via mv.chainPrev booleans
let groups = [{interval:1, items:[]}];  // emom mode
let activeGroup = 0;
let bellTarget = null;
const $ = id => document.getElementById(id);

function defaultLbs(eqp){ return eqp==='bodyweight' ? 0 : 53; }
function fmtSecs(t){ const m=Math.floor(t/60), ss=t%60; return m+':'+String(ss).padStart(2,'0'); }
function isRest(m){ return m && m.type==='rest'; }
function addRest(){ cart.push({type:'rest', name:'Rest', secs:120, chainPrev:false, flowReps:1}); renderCart(); syncBar(); }
function restSecs(a,d){ cart[a].secs=Math.max(15, cart[a].secs+d*15); renderCart(); syncBar(); }

/* ── library render ── */
function renderLib(){
  const q = $('q').value.toLowerCase();
  const lib = $('library'); lib.innerHTML='';
  for (const [cat, items] of Object.entries(LIB)){
    const rows = items.filter(([n,e]) => (eq==='all'||e===eq) && n.toLowerCase().includes(q));
    if (!rows.length) continue;
    const open = q.length>0 || eq!=='all' || cat==='Hinge' || cat==='Combo';
    const box = document.createElement('div');
    box.className = 'cat'+(open?' open':'');
    box.innerHTML = `<div class="catHead" onclick="this.parentNode.classList.toggle('open')">
        <span class="cname gothic">${cat}</span><span class="count">${rows.length}</span><span class="arrow">›</span></div>
      <div class="rows">${rows.map(([n,e])=>{
        const cnt = countInBuild(n);
        return `<div class="exRow${cnt?' inCart':''}" onclick="addEx('${n.replace(/'/g,"\\'")}','${e}',event)">
          <div class="play">▶</div><div class="nm">${n}</div>
          <div class="eq">${e==='single'?'1 KB':e==='double'?'2 KB':'BW'}</div>
          <div class="add">${cnt? (cnt>1? '×'+cnt : '✓') : '+'}</div></div>`;
      }).join('')}</div>`;
    lib.appendChild(box);
  }
}
function countInBuild(name){
  if (mode==='fixed') return cart.filter(m=>m.name===name).length;
  return groups.reduce((s,g)=>s+g.items.filter(m=>m.name===name).length,0);
}
function setEq(v, el){ eq=v; document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===el)); renderLib(); }

/* ── add to cart + fly animation ── */
function addEx(name, eqp, ev){
  const mv = {name, eqp, lbs:defaultLbs(eqp), reps: name==='Turkish Get-Up'?1:10, chainPrev:false, flowReps:1};
  if (mode==='fixed') cart.push(mv); else groups[activeGroup].items.push(mv);
  fly(ev); syncBar(); renderLib();
}
function fly(ev){
  const d = document.createElement('div'); d.className='flyDot'; d.style.background='#A93F48';
  const ph = $('phone').getBoundingClientRect();
  d.style.left=(ev.clientX-ph.left-8)+'px'; d.style.top=(ev.clientY-ph.top-8)+'px';
  $('phone').appendChild(d);
  const bar = $('cartBar').getBoundingClientRect();
  requestAnimationFrame(()=>{ d.style.left=(bar.left-ph.left+18)+'px'; d.style.top=(bar.top-ph.top+12)+'px'; d.style.opacity='0'; d.style.transform='scale(.4)'; });
  setTimeout(()=>d.remove(),520);
  const cb=$('cartBar'); cb.classList.add('bump'); setTimeout(()=>cb.classList.remove('bump'),180);
}

/* ── cart bar ── */
function allItems(){ return mode==='fixed' ? cart : groups.flatMap(g=>g.items); }
function estPerSet(){
  if (mode==='emom') return groups.flatMap(g=>g.items).reduce((s,m)=> s + m.lbs*(m.eqp==='double'?2:1)*m.reps, 0);
  // fixed: each chained member inherits its chain's ×N (stored on the chain head)
  return cart.reduce((s,m,i)=>{
    if (isRest(m)) return s;
    const chained = m.chainPrev || (cart[i+1] && cart[i+1].chainPrev);
    const f = chained ? (cart[chainStartIdx(i)].flowReps||1) : 1;
    return s + m.lbs*(m.eqp==='double'?2:1)*m.reps*f;
  }, 0);
}
function syncBar(){
  const items = allItems();
  $('cartCount').textContent = items.length;
  $('cartCount').style.display = items.length? 'flex':'none';
  if (!items.length){
    $('cartLine1').textContent = mode==='fixed' ? 'The Rack is empty' : 'No exercises yet';
    $('cartLine2').textContent = 'Tap exercises below to add them';
  } else if (mode==='fixed'){
    const exs = items.filter(m=>!isRest(m)).length;
    $('cartLine1').textContent = `${exs} exercise${exs>1?'s':''} · ~${estPerSet().toLocaleString()} lbs/round`;
    $('cartLine2').textContent = items.map(m=>isRest(m)?('Rest '+fmtSecs(m.secs)):m.name).join(' · ');
  } else {
    const used = groups.filter(g=>g.items.length).length;
    const mins = groups.reduce((s,g)=>s+g.interval,0);
    $('cartLine1').textContent = `${groups.length} group${groups.length>1?'s':''} · ${items.length} exercises`;
    $('cartLine2').textContent = used<groups.length ? `Group ${groups.findIndex(g=>!g.items.length)+1} still needs exercises` : `${mins} min pattern · repeats to fill the clock`;
  }
  $('cartDots').innerHTML = items.filter(m=>!isRest(m)).slice(-4).map(m=>{
    const b = BELLS.find(b=>b.lbs===m.lbs);
    return `<div class="d" style="background:${m.lbs? (b?b.c:'#555') : '#A93F48'}"></div>`;
  }).join('');
  $('pillGroup').textContent = `Group ${activeGroup+1} · ${groupMinLabel(activeGroup)}`;
}
function groupMinLabel(i){
  let start=1; for(let k=0;k<i;k++) start+=groups[k].interval;
  const end = start+groups[i].interval-1;
  return groups[i].interval===1? `Min ${start}` : `Min ${start}–${end}`;
}

/* ── cart sheet ── */
function openCart(ev){ if(ev) ev.stopPropagation(); $('cartSheet').classList.add('open'); renderCart(); }
function closeCart(){ $('cartSheet').classList.remove('open'); renderLib(); syncBar(); }

function renderCart(){
  const list = $('cartList');
  $('cartTitle').textContent = mode==='fixed' ? 'The Rack' : 'The Rack';
  $('cartSub').textContent = mode==='fixed' ? 'Part 1 · Fixed Sets' : 'Part 1 · EMOM';
  if (mode==='fixed'){ renderFixedCart(list); } else { renderEmomCart(list); }
  const items = allItems();
  $('doneBtn').disabled = !items.filter(m=>!isRest(m)).length || (mode==='emom' && groups.some(g=>!g.items.length));
  const exCount = items.filter(m=>!isRest(m)).length;
  const restTotal = mode==='fixed' ? cart.filter(isRest).reduce((s,m)=>s+m.secs,0) : 0;
  $('cartStats').innerHTML = items.length ?
    `<div><b>${exCount}</b> exercises</div><div>~<b>${estPerSet().toLocaleString()}</b> lbs/${mode==='fixed'?'round':'pattern'}</div>` +
    (restTotal?`<div><b>${fmtSecs(restTotal)}</b> rest/round</div>`:'') : '';
}

function renderFixedCart(list){
  if (!cart.length){
    list.innerHTML = `<div class="empty"><div class="big"><svg  width="44" height="44" viewBox="0 0 24 24" fill="none"><path d="M8.2 9.1C8.07 8.2 7.6 5.9 7.6 5.2c0-1.5 1.6-2.4 4.4-2.4s4.4.9 4.4 2.4c0 .7-.47 3-.6 3.9" stroke="#F2E8D5" stroke-width="1.9" stroke-linecap="round"/><path d="M12 21.2c-4 0-6.6-2.5-6.6-6 0-2.4 1.3-4.6 3.2-5.7a6.8 6.8 0 0 1 6.8 0c1.9 1.1 3.2 3.3 3.2 5.7 0 3.5-2.6 6-6.6 6Z" fill="#F2E8D5"/></svg></div>Nothing here yet.<br>Add exercises from the library.
      <br><span class="loadBear" onclick="loadBear()">✨ demo: load Rolf's Bear Complex</span></div>`;
    return;
  }
  list.innerHTML = cart.map((m,i)=>{
    const noChain = isRest(m) || isRest(cart[i-1]);
    const chainHtml = i>0 ? (noChain ? '<div class="restGap"></div>' : chainConnector(m,i)) : '';
    return chainHtml + (isRest(m) ? restCard(m,i) : mvCard(m,i,'fixed'));
  }).join('') + `<button id="addRest" onclick="addRest()">⏱&nbsp; <b>+ Add rest period</b> — pause the clock mid-round</button>`;
}
function chainConnector(m,i){
  const on = m.chainPrev;
  const isChainStart = on && (i<2 || !cart[i-1].chainPrev);
  const fr = chainFlowReps(i);
  return `<div class="link ${on?'on':''}" onclick="toggleChain(${i},event)">
      <div class="ln"></div><div class="ic">⛓</div><div class="ln"></div>
      ${on?`<span class="flowTag">FLOW</span>`:''}
      ${on&&isChainStart?`<span class="flowReps" onclick="event.stopPropagation()">
        <span class="pm" onclick="bumpFlow(${i},-1)">−</span><span class="fv">×${fr}</span>
        <span class="pm" onclick="bumpFlow(${i},1)">+</span></span>`:''}
    </div>` + (on&&isChainStart&&fr>1?`<div class="flowHint">chain repeats ×${fr} each round — don't drop the bell</div>`:'');
}
function chainStartIdx(i){ let s=i; while(s>0 && cart[s].chainPrev) s--; return s; }
function chainFlowReps(i){ return cart[chainStartIdx(i)].flowReps || 1; }
function toggleChain(i,ev){
  ev.stopPropagation();
  if (isRest(cart[i]) || isRest(cart[i-1])) return;
  cart[i].chainPrev = !cart[i].chainPrev;
  if (!cart[i].chainPrev){ cart[i].flowReps=1; }
  renderCart();
}
function bumpFlow(i,d){
  const s = chainStartIdx(i);
  cart[s].flowReps = Math.min(20, Math.max(1,(cart[s].flowReps||1)+d));
  renderCart(); syncBar();
}

function restCard(m,i){
  return `<div class="restCard mv">
    <div class="ord">
      <div class="ordBtn" onclick="move(${i},-1)">▲</div>
      <div class="ordBtn" onclick="move(${i},1)">▼</div>
    </div>
    <div class="rIcon">⏱</div>
    <div class="rName">REST<small>clock keeps the round paused</small></div>
    <div class="repCtl">
      <div class="pm" onclick="restSecs(${i},-1)">−</div>
      <div class="rv">${fmtSecs(m.secs)}<small>rest</small></div>
      <div class="pm" onclick="restSecs(${i},1)">+</div>
    </div>
    <div class="rm" onclick="rm(${i})">✕</div>
  </div>`;
}
function mvCard(m,i,ctx,gi){
  const b = BELLS.find(b=>b.lbs===m.lbs);
  const dotStyle = m.lbs ? `background:${b?b.c:'#555'};color:${b&&b.dark?'#121215':'#fff'}` : 'background:#A93F48;color:#fff';
  const dotLabel = m.lbs ? (m.eqp==='double'?'2×':'')+m.lbs : 'BW';
  const chained = ctx==='fixed' && (m.chainPrev || (cart[i+1]&&cart[i+1].chainPrev));
  const args = ctx==='fixed' ? `${i}` : `${gi},${i}`;
  return `<div class="mvCard ${chained?'chained':''} mv">
    <div class="ord">
      <div class="ordBtn" onclick="move(${args},-1)">▲</div>
      <div class="ordBtn" onclick="move(${args},1)">▼</div>
    </div>
    <div class="wDot" style="${dotStyle}" onclick="openBell(${args})">${dotLabel}</div>
    <div class="mvName">${m.name}<small>${m.eqp==='double'?'double bells':m.eqp==='bodyweight'?'bodyweight':'single bell'} · tap dot to change</small></div>
    <div class="repCtl">
      <div class="pm" onclick="rep(${args},-1)">−</div>
      <div class="rv">${m.reps}<small>reps</small></div>
      <div class="pm" onclick="rep(${args},1)">+</div>
    </div>
    <div class="rm" onclick="rm(${args})">✕</div>
  </div>`;
}

/* fixed-mode ops (1 arg) vs emom (2 args) */
function normalizeChains(){
  cart.forEach((m,i)=>{
    if (isRest(m)) { m.chainPrev=false; m.flowReps=1; }
    if (i===0) m.chainPrev=false;
    else if (m.chainPrev && isRest(cart[i-1])) m.chainPrev=false;
  });
}
function move(a,b,c){
  if (mode==='fixed'){ const i=a,d=b; const j=i+d; if(j<0||j>=cart.length)return;
    [cart[i],cart[j]]=[cart[j],cart[i]]; normalizeChains(); }
  else { const g=a,i=b,d=c; const arr=groups[g].items; const j=i+d; if(j<0||j>=arr.length)return;
    [arr[i],arr[j]]=[arr[j],arr[i]]; }
  renderCart(); syncBar();
}
function rep(a,b,c){
  if (mode==='fixed'){ cart[a].reps=Math.max(1,cart[a].reps+b); }
  else { const m=groups[a].items[b]; m.reps=Math.max(1,m.reps+c); }
  renderCart(); syncBar();
}
function rm(a,b){
  if (mode==='fixed'){ cart.splice(a,1); normalizeChains(); }
  else { groups[a].items.splice(b,1); }
  renderCart(); syncBar(); renderLib();
}

/* ── EMOM cart ── */
function renderEmomCart(list){
  list.innerHTML = groups.map((g,gi)=>`
    <div class="grp ${gi===activeGroup?'active':''}">
      <div class="grpHead" onclick="setActiveGroup(${gi})">
        <span class="gname gothic">Group ${gi+1}</span><span class="mins">${groupMinLabel(gi)}</span>
        <span class="intervals" onclick="event.stopPropagation()">
          ${[1,2,3].map(v=>`<span class="intBtn ${g.interval===v?'on':''}" onclick="setInterval_(${gi},${v})">${v} min</span>`).join('')}
        </span>
      </div>
      <div class="grpBody">
        ${g.items.length ? g.items.map((m,i)=>mvCard(m,i,'emom',gi)).join('')
          : `<div class="grpEmpty">No exercises yet.<br><b>Tap “Add exercises”</b> to pick what you'll do ${g.interval===1?'this minute':'in this window'}.</div>`}
        <div class="grpAddRow" onclick="addToGroup(${gi})">+ Add exercises to Group ${gi+1}</div>
      </div>
    </div>`).join('') +
    `<button id="addGroup" onclick="addGroup()">+ Add another group (next minute${groups.length?'s':''})</button>`;
}
function setActiveGroup(gi){ activeGroup=gi; renderCart(); syncBar(); }
function setInterval_(gi,v){ groups[gi].interval=v; renderCart(); syncBar(); }
function addToGroup(gi){ activeGroup=gi; closeCart(); syncBar(); toast(`Now adding to Group ${gi+1}`); }
function addGroup(){ groups.push({interval:1,items:[]}); activeGroup=groups.length-1; renderCart(); syncBar(); }

/* ── bell picker ── */
function openBell(a,b){
  bellTarget = mode==='fixed' ? {m:cart[a]} : {m:groups[a].items[b]};
  if (bellTarget.m.eqp==='bodyweight'){ toast('Bodyweight — no bell needed'); return; }
  $('bellFor').textContent = bellTarget.m.name;
  $('bells').innerHTML = BELLS.map(bl=>`
    <div class="bell ${bl.lbs===bellTarget.m.lbs?'sel':''}" style="background:${bl.c};color:${bl.dark?'#121215':'#fff'}"
      onclick="pickBell(${bl.lbs})">${bl.lbs}<small>${bl.kg} kg</small></div>`).join('');
  $('scrim').classList.add('on'); $('bellSheet').classList.add('open');
}
function pickBell(lbs){ bellTarget.m.lbs=lbs; closeBell(); renderCart(); syncBar(); }
function closeBell(){ $('scrim').classList.remove('on'); $('bellSheet').classList.remove('open'); }

/* ── mode switch + bear demo ── */
function setMode(m){
  mode=m;
  $('tabFixed').classList.toggle('on',m==='fixed');
  $('tabEmom').classList.toggle('on',m==='emom');
  $('hSub').textContent = m==='fixed' ? 'Part 1 · Fixed Sets' : 'Part 1 · EMOM';
  $('groupPill').style.display = m==='emom' ? 'flex':'none';
  closeCart(); renderLib(); syncBar();
}
function loadBear(){
  cart = [
    {name:'Double Clean', eqp:'double', lbs:53, reps:1, chainPrev:false, flowReps:7},
    {name:'Double Front Rack Squat', eqp:'double', lbs:53, reps:1, chainPrev:true, flowReps:1},
    {name:'Double Push Press', eqp:'double', lbs:53, reps:1, chainPrev:true, flowReps:1},
    {name:'Double Front Rack Squat', eqp:'double', lbs:53, reps:1, chainPrev:true, flowReps:1},
    {name:'Double Push Press', eqp:'double', lbs:53, reps:1, chainPrev:true, flowReps:1},
    {type:'rest', name:'Rest', secs:120, chainPrev:false, flowReps:1},
  ];
  renderCart(); syncBar(); renderLib(); toast('The Bear 🐻 — chain ×7, rest 2:00, 5 rounds');
}
function toast(t){ const el=$('toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('on'),2200); }

renderLib(); syncBar();
</script>
</body>
</html>
